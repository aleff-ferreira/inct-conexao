<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="INCT-CONEXAO: rede nacional e internacional de pesquisa para Saúde Única, biodiversidade, clima, bioeconomia e políticas públicas na Amazônia."
    />
    <meta name="theme-color" content="#0d302b" />
    <link rel="icon" type="image/png" href="./assets/logo-symbol.png" />

    <!-- Open Graph / Twitter (padrões do site). Cartões de compartilhamento por
         página são atualizados via JS para a aba do navegador e o Google; os
         scrapers sociais (WhatsApp, Facebook, LinkedIn, X) NÃO executam JS e leem
         apenas estas tags. Por isso og:image / og:url precisam ser ABSOLUTAS.
         Domínio de produção: https://inct-conexao.com.br/ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INCT-CONEXAO" />
    <meta property="og:url" content="https://inct-conexao.com.br/" />
    <meta property="og:title" content="INCT-CONEXAO | Pesquisa, Saúde Única e Bioeconomia na Amazônia" />
    <meta
      property="og:description"
      content="Rede nacional e internacional de pesquisa para Saúde Única, biodiversidade, clima, bioeconomia e políticas públicas na Amazônia."
    />
    <meta property="og:image" content="https://inct-conexao.com.br/assets/hero-forest.jpg" />
    <meta property="og:image:alt" content="Floresta amazônica vista do alto ao pôr do sol — INCT-CONEXAO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INCT-CONEXAO | Pesquisa, Saúde Única e Bioeconomia na Amazônia" />
    <meta
      name="twitter:description"
      content="Rede nacional e internacional de pesquisa para Saúde Única, biodiversidade, clima, bioeconomia e políticas públicas na Amazônia."
    />
    <meta name="twitter:image" content="https://inct-conexao.com.br/assets/hero-forest.jpg" />

    <title>INCT-CONEXAO | Pesquisa, Saúde Única e Bioeconomia na Amazônia</title>
  </head>
  <body>
    <!--
      Sem JavaScript, o site é uma div vazia: ele é uma SPA com roteamento por
      hash, e a hash nunca chega ao servidor. Não dá para servir cada rota como
      página; fingir que dá seria pior do que assumir.

      O que dá para servir são os DADOS, que é o que uma pessoa nessa situação
      quase sempre veio buscar. /figuras/ são arquivos reais, gerados no build
      por scripts/build-figuras.mjs, com gráfico, tabela, fonte e CSV — e sem
      uma linha de script.
    -->
    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:0 20px;font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#11211f">
        <h1 style="font-size:1.5rem;margin:0 0 10px">INCT-CONEXAO</h1>
        <p>Este site precisa de JavaScript para navegar. Os dados, porém, não:</p>
        <p style="margin:18px 0">
          <a href="./figuras/" style="display:inline-block;padding:10px 18px;background:#0d302b;color:#fff;border-radius:999px;text-decoration:none">
            Ver as figuras e baixar os dados
          </a>
        </p>
        <p style="font-size:0.9rem;color:#5d6c69">
          Gráficos, tabelas, fontes e arquivos CSV, em páginas que funcionam sem script.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
