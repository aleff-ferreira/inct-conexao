  # ------------------------------------------------------ MAPA · NARRATIVA
  - name: mapa-narrativa
    label: "Mapa · Capítulos (modo história)"
    label_singular: "Capítulo"
    description: "Capítulos do modo narrativo do Mapa Interativo."
    folder: src/content/mapa/narrativa
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: id
    slug: "{{fields.id}}"
    summary: "{{ordem}} · {{titulo}}"
    editor:
      preview: false
    fields:
      - { label: "Identificador (id)", name: id, widget: string, pattern: ["^[a-z0-9-]+$", "letras minúsculas, números e hifens"] }
      - { label: "Ordem", name: ordem, widget: number, value_type: int, default: 1 }
      - { label: "Título", name: titulo, widget: string }
      - { label: "Texto (parágrafos separados por linha em branco)", name: texto, widget: text }
      - { label: "Estado em foco (sigla, opcional)", name: foco, widget: string, required: false, hint: "Ex.: RO. Deixe vazio para visão nacional." }
      - { label: "Estados a destacar (siglas)", name: destaques, widget: list, field: { label: "UF", name: uf, widget: string }, required: false }
      - label: "Camada a ativar"
        name: camada
        widget: select
        required: false
        hint: "O mapa pinta esta camada enquanto o capítulo estiver em leitura."
        options:
          - { label: "Amazônia Legal", value: amazonia-legal }
          - { label: "Vagas de IC 2026", value: vagas-ic-2026 }
          - { label: "Conteúdo disponível", value: conteudo }
          - { label: "Instituições da rede", value: instituicoes }
          - { label: "Doenças (notificações)", value: doencas-notificacoes }
          - { label: "Focos de calor (INPE, 2003–2024)", value: focos-calor }
          - { label: "Sem camada (só o relevo e os limites)", value: sem-camada }
      - label: "Enquadramento inicial"
        name: enquadrar
        widget: select
        required: false
        hint: "Deixe vazio para o Brasil inteiro. Não use junto com 'Estado em foco' — o enquadramento vence."
        options:
          - { label: "Brasil inteiro", value: brasil }
          - { label: "Amazônia Legal", value: amazonia-legal }
          - { label: "Norte", value: Norte }
          - { label: "Nordeste", value: Nordeste }
          - { label: "Centro-Oeste", value: Centro-Oeste }
          - { label: "Sudeste", value: Sudeste }
          - { label: "Sul", value: Sul }
      - label: "Fontes"
        name: fontes
        widget: list
        required: false
        summary: "{{fields.titulo}}"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Publicador", name: publicador, widget: string, required: false }
          - { label: "URL", name: url, widget: string, required: false }
