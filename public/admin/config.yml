# ============================================================================
#  INCT-CONEXAO · Configuração do painel de conteúdo (Sveltia / Decap CMS)
# ============================================================================
#  Os líderes de grupo editam webinars e grupos por aqui. Ao salvar/publicar, o
#  painel grava os arquivos JSON em src/content/** no repositório do GitHub.
#  Depois o administrador faz `git pull`, `npm run build` e envia o dist/ ao
#  Hostinger (ver docs/cms-setup.md).
#
#  >>> ANTES DE USAR: troque `repo` abaixo pelo seu repositório do GitHub. <<<
# ============================================================================

backend:
  name: github
  repo: aleff-ferreira/inct-conexao # usuário/repositório do GitHub
  branch: main
  # base_url: https://SEU-AUTH.workers.dev   # <-- defina ao configurar o login (ver docs/cms-setup.md)

site_url: https://inct-conexao.com.br
display_url: https://inct-conexao.com.br
logo_url: https://inct-conexao.com.br/assets/logo-symbol.png

# Idioma do painel (Sveltia detecta o navegador; mantém português).
locale: pt

# Uploads (imagens/vídeos) vão para /public/assets no repositório.
media_folder: public/assets
public_folder: /assets

# Mensagens de commit amigáveis no histórico do GitHub.
backend_commit_messages:
  create: "Cria {{collection}} “{{slug}}” (via painel)"
  update: "Atualiza {{collection}} “{{slug}}” (via painel)"
  delete: "Remove {{collection}} “{{slug}}” (via painel)"
  uploadMedia: "Envia mídia “{{path}}” (via painel)"
  deleteMedia: "Remove mídia “{{path}}” (via painel)"

collections:
  # ---------------------------------------------------------------- NOTÍCIAS
  # Matérias/reportagens publicadas em #/noticias. O corpo é montado com
  # BLOCOS: clique em "Adicionar" e escolha o tipo (texto, foto, citação...).
  # As imagens de cada matéria ficam em public/assets/noticias/<slug>/.
  - name: noticias
    label: "Notícias / Matérias"
    label_singular: "Matéria"
    description: "Reportagens de campo, expedições e resultados da rede."
    folder: src/content/noticias
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{data}} · {{titulo}}"
    sortable_fields: [data, titulo]
    editor:
      preview: false
    fields:
      - label: "Identificador na URL (slug)"
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Use apenas letras minúsculas, números e hifens."]
        hint: "Aparece em #/noticias/<slug>. Use o MESMO nome da pasta de imagens."
      - { label: "Título", name: titulo, widget: string }
      - label: "Chapéu (editoria)"
        name: chapeu
        widget: string
        required: false
        hint: "Ex.: Expedição científica · Rondônia"
      - label: "Linha-fina (resumo de 1 parágrafo)"
        name: resumo
        widget: text
        hint: "Aparece nos cartões, na busca do Google e nas redes sociais."
      - { label: "Data de publicação", name: data, widget: date, format: "YYYY-MM-DD" }
      - { label: "Atualizado em", name: atualizadoEm, widget: date, format: "YYYY-MM-DD", required: false }
      - label: "Local"
        name: local
        widget: string
        required: false
        hint: "Ex.: Guajará-Mirim e Nova Mamoré (RO)"
      - label: "Assinatura (quem escreveu)"
        name: autores
        widget: list
        required: false
        label_singular: "Autor"
        summary: "{{fields.nome}}"
        hint: "Deixe vazio para a matéria assinar como INCT-CONEXAO."
        fields:
          - { label: "Nome", name: nome, widget: string }
          - { label: "Papel", name: papel, widget: string, required: false, default: "Texto", hint: 'Ex.: "Texto", "Texto e fotos", "Edição".' }
          - { label: "Currículo Lattes", name: lattes, widget: string, required: false }
          - { label: "LinkedIn", name: linkedin, widget: string, required: false }
          - { label: "Outro perfil (ORCID, site)", name: url, widget: string, required: false }
      - label: "Foto de topo"
        name: imagem
        widget: object
        required: false
        fields:
          - { label: "Arquivo", name: arquivo, widget: string, hint: "Nome do arquivo dentro de public/assets/noticias/<slug>/" }
          - { label: "Texto alternativo", name: alt, widget: string, hint: "Descreva a cena para quem não enxerga a foto." }
      - { label: "Crédito da foto de topo", name: imagemCredito, widget: string, required: false }
      - label: "Números de destaque (barra do topo)"
        name: numeros
        widget: list
        required: false
        label_singular: "Número"
        summary: "{{fields.rotulo}}: {{fields.valor}}"
        fields:
          - { label: "Rótulo", name: rotulo, widget: string }
          - { label: "Valor", name: valor, widget: string }
      # ---- corpo da matéria (blocos) ----
      - label: "Corpo da matéria"
        name: blocos
        widget: list
        label_singular: "Bloco"
        types:
          - label: "Texto"
            name: texto
            widget: object
            summary: "Texto"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: texto }
              - label: "Parágrafos"
                name: texto
                widget: text
                hint: "Separe parágrafos com uma linha em branco. Aceita **negrito**, _itálico_ e [texto](link)."
          - label: "Intertítulo"
            name: subtitulo
            widget: object
            summary: "{{fields.texto}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: subtitulo }
              - { label: "Texto", name: texto, widget: string }
          - label: "Foto"
            name: imagem
            widget: object
            summary: "Foto: {{fields.legenda}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: imagem }
              - label: "Imagem"
                name: imagem
                widget: object
                fields:
                  - { label: "Arquivo", name: arquivo, widget: string }
                  - { label: "Texto alternativo", name: alt, widget: string }
              - { label: "Legenda", name: legenda, widget: string, required: false }
              - { label: "Crédito", name: credito, widget: string, required: false }
          - label: "Galeria (2 a 4 fotos)"
            name: galeria
            widget: object
            summary: "Galeria: {{fields.legenda}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: galeria }
              - label: "Imagens"
                name: imagens
                widget: list
                min: 2
                max: 4
                fields:
                  - { label: "Arquivo", name: arquivo, widget: string }
                  - { label: "Texto alternativo", name: alt, widget: string }
              - { label: "Legenda", name: legenda, widget: string, required: false }
              - { label: "Crédito", name: credito, widget: string, required: false }
          - label: "Vídeo"
            name: video
            widget: object
            summary: "Vídeo: {{fields.arquivo}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: video }
              - { label: "Arquivo .mp4", name: arquivo, widget: string, hint: "Em public/assets/noticias/<slug>/" }
              - { label: "Capa (.webp)", name: poster, widget: string, required: false }
              - { label: "Descrição para leitor de tela", name: descricao, widget: string }
              - { label: "Legenda", name: legenda, widget: string, required: false }
              - { label: "Crédito", name: credito, widget: string, required: false }
              - { label: "Transcrição da fala", name: transcricao, widget: text, required: false, hint: "Obrigatória se houver voz no vídeo." }
          - label: "Citação"
            name: citacao
            widget: object
            summary: "Citação: {{fields.autor}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: citacao }
              - { label: "Frase", name: texto, widget: text }
              - { label: "Quem disse", name: autor, widget: string, required: false }
          - label: "Cartão de destaque (lista)"
            name: destaque
            widget: object
            summary: "Destaque: {{fields.titulo}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: destaque }
              - { label: "Título", name: titulo, widget: string, required: false, hint: 'Ex.: "Em 30 segundos"' }
              - { label: "Itens", name: itens, widget: list, field: { label: Item, name: item, widget: string } }
          - label: "Passo a passo numerado"
            name: etapas
            widget: object
            summary: "Etapas: {{fields.titulo}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: etapas }
              - { label: "Título", name: titulo, widget: string, required: false }
              - label: "Etapas"
                name: itens
                widget: list
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Nome da etapa", name: titulo, widget: string }
                  - { label: "Explicação", name: texto, widget: text }
          - label: "Tabela (rótulo e valor)"
            name: tabela
            widget: object
            summary: "Tabela: {{fields.titulo}}"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: tabela }
              - { label: "Título", name: titulo, widget: string, required: false }
              - label: "Linhas"
                name: linhas
                widget: list
                summary: "{{fields.rotulo}}: {{fields.valor}}"
                fields:
                  - { label: "Rótulo", name: rotulo, widget: string }
                  - { label: "Valor", name: valor, widget: string }
                  - label: "Etapa concluída?"
                    name: estado
                    widget: select
                    required: false
                    options: [{ label: "Ainda pendente", value: "pendente" }, { label: "Concluída", value: "feito" }]
                    hint: "Só muda o desenho: a etapa concluída ganha um sinal de check."
          - label: "Perguntas frequentes"
            name: faq
            widget: object
            summary: "Perguntas frequentes"
            fields:
              - { label: "Tipo", name: tipo, widget: hidden, default: faq }
              - { label: "Título", name: titulo, widget: string, required: false }
              - label: "Perguntas"
                name: itens
                widget: list
                summary: "{{fields.pergunta}}"
                fields:
                  - { label: "Pergunta", name: pergunta, widget: string }
                  - { label: "Resposta", name: resposta, widget: text }
      # ---- rodapé ----
      - label: "Quem esteve em campo"
        name: equipe
        widget: list
        required: false
        summary: "{{fields.nome}}"
        fields:
          - { label: "Nome", name: nome, widget: string }
          - { label: "Instituição", name: instituicao, widget: string, required: false }
      - label: "Créditos (realização e apoio)"
        name: creditos
        widget: text
        required: false
        hint: "Aceita **negrito**."
      - { label: "Resumo em inglês", name: resumoIngles, widget: text, required: false }
      - label: "Fontes"
        name: fontes
        widget: list
        required: false
        summary: "{{fields.titulo}}"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Link", name: url, widget: string, required: false }
      - { label: "Etiquetas", name: tags, widget: list, required: false, field: { label: Etiqueta, name: tag, widget: string } }
      - label: "SEO e compartilhamento"
        name: seo
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Título para redes sociais", name: ogTitle, widget: string, required: false }
          - { label: "Descrição para redes sociais", name: ogDescription, widget: text, required: false }
          - label: "Imagem de compartilhamento"
            name: ogImage
            widget: string
            required: false
            hint: "Mantenha em .jpg (1200x630). Fica na pasta da matéria."
          - { label: "Palavras-chave", name: keywords, widget: list, required: false, field: { label: Palavra, name: kw, widget: string } }
      - label: "Publicado"
        name: publicado
        widget: boolean
        default: true
        hint: "Desmarque para deixar a matéria como rascunho (some do site)."

  # ---------------------------------------------------------------- WEBINARS
  - name: webinars
    label: "Webinars / Transmissões"
    label_singular: "Webinar"
    description: "Mesas-redondas e transmissões científicas."
    folder: src/content/webinars
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    editor:
      preview: false
    fields:
      - label: "Identificador na URL (slug)"
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Use apenas letras minúsculas, números e hifens."]
        hint: "Aparece em #/webinars/<slug>. Não repita o de outro webinar."
      - { label: "Título", name: title, widget: string }
      - { label: "Subtítulo", name: subtitle, widget: text, required: false }
      - { label: "Tema (etiqueta curta)", name: theme, widget: string, required: false }
      - { label: "Resumo (1 linha, para os cartões)", name: summary, widget: text, required: false }
      - label: "Descrição completa"
        name: description
        widget: text
        required: false
        hint: "Separe parágrafos com uma linha em branco."
      - label: "Grupo responsável"
        name: groupSlug
        widget: relation
        required: false
        collection: groups
        value_field: slug
        search_fields: ["name"]
        display_fields: ["name"]
        hint: "Escolha o grupo dono deste webinar."
      - label: "Início"
        name: startsAt
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        hint: "Use o horário de Rondônia (UTC-4)."
      - label: "Término"
        name: endsAt
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
      - { label: "Texto do fuso horário", name: timezoneLabel, widget: string, default: "Horário de Rondônia (UTC-4)" }
      - label: "Forçar status (opcional)"
        name: status
        widget: select
        required: false
        options:
          - { label: "Automático (pelas datas)", value: "" }
          - { label: "Em breve", value: upcoming }
          - { label: "Ao vivo", value: live }
          - { label: "Encerrado", value: ended }
        default: ""
        hint: "Deixe em Automático para calcular pelas datas."
      - label: "Publicado (visível no site)"
        name: published
        widget: boolean
        default: true
        hint: "Desligue para deixar em STANDBY: o webinar some do site (sem perder o conteúdo). Útil enquanto não há data confirmada."
      - { label: "Imagem de capa", name: heroImage, widget: image, required: false, choose_url: false }
      - label: "URL da transmissão ao vivo"
        name: liveStream
        widget: string
        required: false
        hint: "Cole a URL do YouTube/Vimeo/StreamYard. Zoom/Meet viram botão “Abrir transmissão”."
      - label: "URL da gravação (replay)"
        name: replay
        widget: string
        required: false
        hint: "URL do YouTube/Vimeo da gravação. (Ou envie um arquivo abaixo.)"
      - { label: "Ou envie um arquivo de vídeo (.mp4)", name: replayVideo, widget: file, required: false }
      - { label: "Imagem do player (pôster)", name: posterImage, widget: image, required: false, choose_url: false }
      - { label: "Link de inscrição", name: registrationUrl, widget: string, required: false }
      - { label: "Link para perguntas (Slido/Forms)", name: questionUrl, widget: string, required: false }
      - label: "Palestrantes"
        name: speakers
        label_singular: "Palestrante"
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: "Nome", name: name, widget: string }
          - { label: "Função / cargo", name: role, widget: string }
          - { label: "Sigla da instituição", name: affiliation, widget: string }
          - { label: "Instituição (nome completo)", name: affiliationFull, widget: string, required: false }
          - { label: "Mini-biografia", name: bio, widget: text, required: false }
          - { label: "Foto", name: photo, widget: image, required: false, choose_url: false }
      - label: "Moderação"
        name: moderator
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Nome", name: name, widget: string }
          - { label: "Função / cargo", name: role, widget: string }
          - { label: "Sigla da instituição", name: affiliation, widget: string }
          - { label: "Instituição (nome completo)", name: affiliationFull, widget: string, required: false }
          - { label: "Mini-biografia", name: bio, widget: text, required: false }
          - { label: "Foto", name: photo, widget: image, required: false, choose_url: false }
      - label: "Programação"
        name: agenda
        label_singular: "Item"
        widget: list
        required: false
        summary: "{{fields.time}} — {{fields.title}}"
        fields:
          - { label: "Horário (HH:MM)", name: time, widget: string }
          - { label: "Atividade", name: title, widget: string }
          - { label: "Responsável", name: speaker, widget: string, required: false, hint: "Use “—” para debate/intervalo." }
      - label: "Materiais"
        name: materials
        label_singular: "Material"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Título", name: title, widget: string }
          - label: "Tipo"
            name: kind
            widget: select
            options: ["PDF", "Slides", "Link", "Vídeo"]
          - { label: "Link (opcional)", name: href, widget: string, required: false }
          - { label: "Observação", name: note, widget: text, required: false }
      - label: "Parceiros / Apoio"
        name: partners
        label_singular: "Parceiro"
        widget: list
        required: false
        summary: "{{fields.acronym}} {{fields.name}}"
        fields:
          - { label: "Nome", name: name, widget: string }
          - { label: "Sigla", name: acronym, widget: string, required: false }
          - { label: "Logotipo", name: logo, widget: image, required: false, choose_url: false }
      - label: "SEO / Compartilhamento (opcional)"
        name: seo
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Título para compartilhamento", name: ogTitle, widget: string, required: false }
          - { label: "Descrição para compartilhamento", name: ogDescription, widget: text, required: false }
          - { label: "Imagem para compartilhamento", name: ogImage, widget: image, required: false, choose_url: false }
          - { label: "Palavras-chave", name: keywords, widget: list, required: false }

  # ------------------------------------------------------------------ GRUPOS
  - name: groups
    label: "Grupos de pesquisa"
    label_singular: "Grupo"
    description: "Descrição de cada grupo de pesquisa do INCT."
    folder: src/content/groups
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{name}}"
    editor:
      preview: false
    fields:
      - label: "Identificador na URL (slug)"
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Use apenas letras minúsculas, números e hifens."]
        hint: "Aparece em #/grupos/<slug>."
      - { label: "Nome do grupo", name: name, widget: string }
      - { label: "Sigla / etiqueta curta", name: acronym, widget: string, required: false }
      - label: "Descrição"
        name: description
        widget: text
        required: false
        hint: "Separe parágrafos com uma linha em branco."
      - { label: "Líder do grupo", name: leaderName, widget: string, required: false }
      - { label: "Instituição", name: institution, widget: string, required: false }
      - { label: "Imagem de capa", name: coverImage, widget: image, required: false, choose_url: false }
      - label: "Links"
        name: links
        label_singular: "Link"
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: "Texto do link", name: label, widget: string }
          - { label: "URL", name: href, widget: string }
      - label: "Publicado (visível no site)"
        name: published
        widget: boolean
        default: true
        hint: "Desligue para deixar o grupo oculto enquanto edita."

  # ------------------------------------------------------- MAPA · ESTADOS
  - name: mapa-estados
    label: "Mapa · Fichas de estado"
    label_singular: "Ficha de estado"
    description: "Conteúdo por unidade federativa exibido no Mapa Interativo (#/mapa)."
    folder: src/content/mapa/estados
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: uf
    slug: "{{fields.uf}}"
    summary: "{{uf}}"
    editor:
      preview: false
    fields:
      - label: "UF (sigla de 2 letras)"
        name: uf
        widget: string
        pattern: ["^[A-Za-z]{2}$", "Use a sigla de 2 letras (ex.: RO). O arquivo deve ter esse nome, em minúsculas."]
        hint: "Ex.: RO, AM, CE. Salve o arquivo com a sigla em minúsculas (ro.json)."
      - { label: "Resumo (visão geral)", name: resumo, widget: text, required: false }
      - { label: "Destaque curto (aparece no preview do mapa)", name: destaque, widget: string, required: false }
      - label: "Publicado (visível no mapa)"
        name: publicado
        widget: boolean
        default: true
        hint: "Desligue para deixar a ficha oculta enquanto edita."
      - label: "Ficha de demonstração"
        name: demonstracao
        widget: boolean
        default: false
        hint: "Ligue para marcar como exemplo ilustrativo, ainda não revisado para produção."
      - { label: "Revisado por", name: revisadoPor, widget: string, required: false }
      - { label: "Revisado em (AAAA-MM-DD)", name: revisadoEm, widget: string, required: false }
      - label: "Animais peçonhentos"
        name: animais
        label_singular: "Animal"
        widget: list
        required: false
        summary: "{{fields.nomeComum}} ({{fields.nomeCientifico}})"
        fields:
          - { label: "Nome comum", name: nomeComum, widget: string }
          - { label: "Nome científico", name: nomeCientifico, widget: string }
          - { label: "Grupo (serpente, escorpião, aranha…)", name: grupo, widget: string }
          - label: "Confiança de ocorrência no estado"
            name: ocorrencia
            widget: select
            options:
              - { label: "Confirmada", value: confirmado }
              - { label: "Provável", value: provavel }
              - { label: "Incerta", value: incerto }
            default: provavel
          - { label: "Distribuição", name: distribuicao, widget: string, required: false }
          - { label: "Como reconhecer", name: identificacao, widget: text, required: false }
          - { label: "Prevenção", name: prevencao, widget: list, field: { label: "Item", name: item, widget: string }, required: false }
          - { label: "Em caso de acidente", name: primeirosSocorros, widget: list, field: { label: "Item", name: item, widget: string }, required: false }
          - { label: "NÃO faça", name: naoFazer, widget: list, field: { label: "Item", name: item, widget: string }, required: false }
          - { label: "Imagem (foto CREDITADA — nunca gerada por IA)", name: imagem, widget: image, required: false, choose_url: false }
          - { label: "Crédito da imagem", name: imagemCredito, widget: string, required: false }
          - { label: "Texto alternativo da imagem", name: imagemAlt, widget: string, required: false }
          - label: "Fontes"
            name: fontes
            widget: list
            required: false
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Publicador", name: publicador, widget: string, required: false }
              - { label: "URL", name: url, widget: string, required: false }
      - label: "Doenças (tropicais/negligenciadas/zoonoses)"
        name: doencas
        label_singular: "Doença"
