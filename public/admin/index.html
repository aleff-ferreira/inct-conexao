<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O painel não deve ser indexado por buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/logo-symbol.png" />
    <title>INCT-CONEXAO · Painel de conteúdo</title>
  </head>
  <body>
    <!--
      Sveltia CMS — editor de conteúdo (webinars + grupos) compatível com Decap CMS.
      Lê a configuração em ./config.yml e grava os arquivos JSON no repositório do
      GitHub (ver config.yml -> backend.repo). Para trocar pelo Decap CMS clássico,
      basta substituir o src abaixo por
      https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
