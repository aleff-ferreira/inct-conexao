<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O painel não deve ser indexado por buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/logo-symbol.png" />
    <title>INCT-CONEXAO · Painel de conteúdo</title>
  </head>
  <body>
    <!--
      Sveltia CMS — editor de conteúdo (webinars + grupos) compatível com Decap CMS.
      Lê a configuração em ./config.yml e grava os arquivos JSON no repositório do
      GitHub (ver config.yml -> backend.repo).

      VERSÃO PINADA de propósito: sem o pin, o unpkg serve o "latest" e uma
      atualização do Sveltia pode derrubar o painel inteiro sem ninguém tocar no
      site (foi o que a 0.180.0 fez ao remover o widget `date`). Atualize o pin
      conscientemente, testando o /admin local antes.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.180.0/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
